[package]
name = "cortex54-desktop"
version = "0.1.0"
description = "CORTEX-54 desktop app: the local brain, the cockpit and a tray pill"
edition = "2021"

[lib]
name = "cortex54_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
