<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CORTEX-54</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15191c; color: #c9d1d9; font: 15px/1.5 -apple-system, "Segoe UI", sans-serif; }
      main { height: 100%; display: grid; place-items: center; text-align: center; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: #38bdf8; display: inline-block; animation: p 1.2s infinite; }
      @keyframes p { 50% { opacity: .25 } }
      small { color: #6b7785; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p><span class="dot"></span></p>
        <h2>Starting CORTEX-54</h2>
        <p>The brain is waking up on this computer. The cockpit opens in a few seconds.</p>
        <small>Nothing trades until the brain has checked the account, the regime and its own health.</small>
      </div>
    </main>
  </body>
</html>
