[project]
name = "cortex-research"
version = "0.1.0"
description = "CORTEX-54 batch research jobs (GitHub Actions): run pinned upstream skills, sign, ingest"
requires-python = ">=3.11"
dependencies = [
  # Upstream tradermonty skills (run from a pinned checkout, never copied): requests everywhere,
  # pandas-market-calendars for market-top-detector, yfinance as the upstream macro-regime fallback.
  "requests>=2.31.0",
  "pandas-market-calendars==5.2.2",
  "yfinance>=0.2.0",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]
# Kronos forecasts (ADR-041), only for `run kronos`; torch comes from the CPU-only index on Linux runners.
kronos = [
  "torch>=2.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "einops==0.8.1",
  "huggingface_hub==0.33.1",
  "safetensors==0.6.2",
  "tqdm>=4.66",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
