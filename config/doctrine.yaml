# CORTEX-54 doctrine — tunable parameters.
# Bounded by config/constitution.json (validated at boot; any looser value fails the deploy).
# Changes arrive as pull requests (operator or Governor). See docs/RISK_DOCTRINE.md for the math.
version: 1

accounts:
  PAPER:
    alpaca_base_url: https://paper-api.alpaca.markets
    starting_equity_usd: 54
    autonomy_stop: 2 # PAPER: 0 shadow, 2 autonomous, 4 colleague. No approve-each-trade mode (ADR-024).
    apply_fee_model: true # Alpaca paper charges nothing; we do
  LIVE:
    alpaca_base_url: https://api.alpaca.markets
    starting_equity_usd: 54
    autonomy_stop: 0 # LIVE: dormant until all phases are built + PAPER graduates + operator RATIFY → 3
    apply_fee_model: false # real fees come from the broker

rungs:
  R1:
    {
      equity_min: 0,
      equity_max: 100,
      total_heat: 0.12,
      per_trade_risk: 0.025,
      max_position_notional: 0.35,
      max_positions: 3,
    }
  R2:
    {
      equity_min: 100,
      equity_max: 250,
      total_heat: 0.15,
      per_trade_risk: 0.025,
      max_position_notional: 0.35,
      max_positions: 3,
    }
  R3:
    {
      equity_min: 250,
      equity_max: 2500,
      total_heat: 0.18,
      per_trade_risk: 0.020,
      max_position_notional: 0.30,
      max_positions: 4,
    }
  R4:
    {
      equity_min: 2500,
      equity_max: 25000,
      total_heat: 0.20,
      per_trade_risk: 0.015,
      max_position_notional: 0.25,
      max_positions: 6,
    }
  R5:
    {
      equity_min: 25000,
      equity_max: null,
      total_heat: 0.20,
      per_trade_risk: 0.010,
      max_position_notional: 0.20,
      max_positions: 10,
    }

breakers:
  yellow_drawdown: 0.03
  orange_drawdown: 0.06
  red_drawdown: 0.10
  red_daily_loss: 0.05
  red_consecutive_stopouts_24h: 3
  paper_auto_unlock_hours: 24 # PAPER self-recovers after RED once flat (ADR-025); LIVE never does
  multipliers: { GREEN: 1.0, YELLOW: 0.5, ORANGE: 0.0, RED: 0.0 }
  recovery_margin: 0.005 # audit W3-01: recover only once 0.5% clear of the threshold …
  recovery_pulses: 3 # … for 3 pulses in a row (worse bands still apply at once)

sizing:
  funding_shrink: { above_annualized: 0.35, multiplier: 0.5 } # audit W2-30: |perp funding| ≥ 35%/yr → half size
  min_stop_atr_multiple: 1.2
  bear_disagreement: { floor: 0.3, max_penalty: 0.7 } # D_bear = min(max_penalty, max(0, lethality - floor))
  reputation_weight: { min: 0.5, max: 1.2, min_signals_before_adjusting: 20 }
  edge_gate: { p_zero: 0.5, p_full: 0.75 } # g(p) ramps from 0 at p_zero to 1 at p_full
  correlation_guard: { lookback_days: 60, max_corr: 0.7 }
  # ADR-042: a risk-sized order under the venue minimum may be lifted to it (≤ 4× the risk-sized notional), only while
  # the lifted order still risks no more than the rung's per-trade cap and fits concentration, cash and heat.
  min_ticket: { max_upscale: 4.0 }

fees:
  crypto_maker: 0.0015
  crypto_taker: 0.0025
  equity_commission: 0.0
  equity_sell_regulatory_min_usd: 0.01
  paper_slippage_bps: { EQUITIES: 5, CRYPTO: 10, OPTIONS: 25 }
  hurdle_multiple: 3.0

execution:
  order_style: passive_limit # peg at best bid (buy) / best ask (sell), never cross unless IMMEDIATE
  max_unfilled_pulses: 3
  exit_collar_bps: 75 # marketable-limit exits capped this far through the touch
  no_entry_last_minutes_of_session: 10
  earnings_blackout_hours: 72
  max_spread_bps: { CRYPTO: 30, EQUITIES: 25, OPTIONS: 500 }
  reservation_ttl_seconds: 120
  min_order_notional_usd: { CRYPTO: 10, EQUITIES: 1, OPTIONS: 0 } # Alpaca: crypto cost basis ≥ $10
  sanity: { enabled: true, max_depeg_bps: 50, max_venue_gap_pct: 1.0 } # ADR-067: USDT/USDC off $1, Alpaca vs Coinbase, Nasdaq halts

cadence:
  pulse_seconds_exposed: 60
  pulse_seconds_flat: 300
  pulse_seconds_thrift: 120
  hud_min_edit_interval_seconds: 5

staleness:
  quote_seconds: 120
  regime_batch_hours: { CRYPTO: 6, EQUITIES: 30 }
  screener_batch_hours: 30
  news_cursor_minutes: 15

funnel:
  tier1:
    model: "@cf/cloudflare/clef-flash"
    batch_max_items: 1 # one item per Clef call: batching compresses scores (ADR-027)
    # Observed live: GDELT noise ≈ 0.15, borderline headlines ≈ 0.45, a real BTC crash headline 0.88. Tier 1 is
    # only a noise filter; Clef 27B (Tier 2) and the court are the strict gates (ADR-029).
    escalate_threshold: 0.45 # P(material) needed to promote to Tier 2 (ADR-037: 0.55 promoted 0 of 38/day)
    min_escalate_score: 1.2 # probability-weighted 0 Reject … 3 Deep (1 Watchlist, 2 Shadow)
    max_batches_per_pulse: 8 # ≈1.2 neurons per call → ≤ ~10 neurons per pulse
  tier2:
    model: "@cf/cloudflare/clef"
    pass_threshold: 0.72
    max_per_day: 40
  facts: # ADR-043: Clairic pulls typed numbers out of each promoted catalyst (~6 neurons each)
    enabled: true
    min_confidence: 0.8 # below this a value is listed as uncertain, never shown as a fact
    max_per_day: 60
    min_chars: 60
  research: # ADR-051: web research desk (GitHub Actions agent, free LLM chain) builds a sourced dossier per court case
    enabled: true
    fresh_hours: 12 # a dossier younger than this is reused instead of researching again
    wait_minutes: 25 # the court holds a case this long for any dossier, then convenes without one
    # operator 2026-10-26: the court waits for the DEEP dossier; the fast ring is only the fallback when the deep one
    # isn't in 12 min after dispatch (deep runs take ~6–15 min; past 12 the catalyst is going stale)
    deep_wait_minutes: 12
    max_per_day: 16 # dispatches per UTC day (the court itself is capped at 12)
  tier3:
    max_sprints_per_day: 12
    # 2026-10-27: quality is a 5-level score mapped to 0/25/50/75/100, so 78 meant "Excellent only": in 3 days of live
    # data no candidate ever passed (best 27). 70 lets "Strong" through; long_favored, regime and setup still gate.
    min_structural_score: 70
    disagreement_tax: 1.0 # audit W2-07: 0.85 once the Governor shows contested rulings do worse; 1.0 = log only
  calibration:
    min_outcomes_before_trusting: 50
    shrink_to: 0.5
    warmup_min_weight: 0.5 # ADR-056 (was 0.3): floor on trust during warm-up so PAPER can collect outcomes at all

budgets:
  thrift_fraction: 0.7
  hard_stop_fraction: 0.9 # must be <= constitution free_tier_hard_stop_fraction
  workers_ai_neurons_per_day:
    total_free: 10000
    tier1: 3000
    tier2: 4000
    tier3_fallback: 1500
    clairic: 500 # ADR-043, carved from the reserve
    reserve: 1000
  neurons_per_mtok: { clef-flash: 3455, clef: 21818, clairic: 9091 } # Workers AI pricing, input tokens (output not billed)
  daily_limits:
    worker_requests: 100000
    do_requests: 100000
    do_duration_gb_s: 13000
    do_rows_written: 100000
    do_rows_read: 5000000
    d1_rows_written: 100000
    d1_rows_read: 5000000
  per_invocation:
    subrequests: 50
    cf_service_subrequests: 1000

llm_routing:
  # Verified live 2026-10-22 (ADR-028), re-checked by the canary 2026-10-26 (ADR-070). family = model lineage; bull and
  # bear must differ (ADR-009). Only models in a chain are listed (audit 2026-10-27: deepseek and the OpenRouter gemma
  # entry were out of every chain); any other model gets its family from its name (src/court/models.ts).
  families:
    gemini: google
    groq/openai/gpt-oss-120b: openai-oss
    groq/qwen/qwen3.8-27b: qwen
    groq/openai/gpt-oss-20b: openai-oss
    nim/nvidia/nemotron-3-ultra-550b-a55b: nvidia
  # Probe 2026-10-26 (bull prompt, live BTC): gemini-3.5 ok in ~14 s (503 at peak), qwen ok in ~2 s, gpt-oss-20b ok in
  # ~2 s; nemotron (NIM and OpenRouter) answers in prose, not JSON; deepseek times out at 60 s, so it is out of both
  # chains (one timeout ate 40% of the hearing deadline).
  # Canary 2026-10-26 (ADR-070): both Gemini models 503 "high demand", Qwen hit Groq's JSON validation and TPM caps,
  # Nemotron is reliable once NIM gets a 4,096-token output budget (it reasons first). Ordered so a cross-family
  # pair always exists: if only Groq's gpt-oss family answers for the bull, Nemotron (nvidia) takes the bear.
  bull_chain:
    - { provider: gemini, model: gemini-3.5-flash }
    - { provider: groq, model: qwen/qwen3.8-27b }
    - { provider: groq, model: openai/gpt-oss-20b }
    - { provider: nim, model: nvidia/nemotron-3-ultra-550b-a55b }
  bear_chain:
    - { provider: groq, model: openai/gpt-oss-120b }
    - { provider: nim, model: nvidia/nemotron-3-ultra-550b-a55b }
    - { provider: gemini, model: gemini-3.5-flash }
    - { provider: groq, model: qwen/qwen3.8-27b }
  panel: # ADR-044: the bull answers the bear, then three experts weigh in (in parallel) before the Clef judge
    rebuttal: true
    seats: [quant, risk, macro]
    timeout_ms: 25000 # advisory seats: a slow seat is dropped, never waited on for a minute
    # live run 2026-10-24: nemotron returned no JSON, deepseek timed out at 60 s, qwen failed Groq's JSON validation.
    # Seats rotate through this chain, so each starts on a different model.
    chain:
      - { provider: groq, model: openai/gpt-oss-120b }
      - { provider: groq, model: openai/gpt-oss-20b }
      - { provider: gemini, model: gemini-3.5-flash }
  # ADR-063 BYOK (revised 2026-10-26): the user's two endpoints (bull + bear) are put in front of these chains at
  # runtime from BYOK_* keys (src/court/providers.ts withByok), each model its own family. Nothing to configure here.
  require_cross_family: true
  hearing_deadline_ms: 150000 # audit W2-05: past 60% skip the panel, past 40% skip the rebuttal
  daily_call_caps: { gemini: 250, groq: 900, nim: 800, openrouter: 45 } # audit W2-06: under each free RPD
  max_retries_per_provider: 1
  timeout_ms: 60000

regime_gates:
  crypto_composite_min_for_longs: 40
  # ADR-056: REDUCE_ONLY ("be selective") admits court entries at half size, and all stock exposure stays under the
  # exposure coach's ceiling. CASH_PRIORITY still blocks. Rule strategies (RSI(2), inverse ETFs) are not resized here.
  equity_postures_allowing_entries: [NEW_ENTRY_ALLOWED, REDUCE_ONLY]
  equity_posture_size: { REDUCE_ONLY: 0.5 }
  # ADR-039: an exceptional catalyst may still trade against a closed gate, smaller and judged harder.
  # Never in CASH_PRIORITY, never on stale regime data (fail closed, U6), never more than one at a time.
  exception_lane:
    enabled: true
    equity_postures: [] # ADR-056: REDUCE_ONLY is now a regular (half-size) posture
    crypto_composite_floor: 25
    min_tier1_material: 0.85
    min_tier1_escalate: 2.2
    min_tier2_long_favored: 0.85
    size_multiplier: 0.5
    max_concurrent: 1

# ADR-045: LAB brain (CORTEX-54-LAB) — second paper account + journal `cortex-lab`. Strategies listed here run ONLY
# there, as ACTIVE, with no AI calls (no Clef, court or Clairic). A strategy graduates to PAPER by PR once its LAB
# record and backtest agree.
lab:
  strategies:
    - CRYPTO_KRONOS_FORECAST_V1 # operator: Kronos never trades on PAPER; LAB measures whether it should
    - CRYPTO_TREND_V1
    - EQUITY_RSI2_PULLBACK_V1
    - CRYPTO_TURN_OF_MONTH_V1
    - CRYPTO_OVERSOLD_BOUNCE_V1 # ADR-046: demoted from PAPER by the backtest
    - EQUITY_INVERSE_BREAKOUT_V1 # ADR-046: demoted from PAPER by the backtest

strategies:
  - id: CRYPTO_BREAKOUT_BASELINE_V1
    arena: CRYPTO
    status: ACTIVE # Phase 1 plumbing strategy, deterministic, no LLM
    universe: # ADR-037: every liquid pair the court can trade
      [
        BTC/USD,
        ETH/USD,
        SOL/USD,
        XRP/USD,
        LINK/USD,
        AVAX/USD,
        DOGE/USD,
        LTC/USD,
        BCH/USD,
        DOT/USD,
        UNI/USD,
        AAVE/USD,
        ADA/USD,
      ]
    params:
      lookback_days: 20
      atr_period: 14
      atr_stop_multiple: 2.0
      atr_target_multiple: 3.0
      max_hold_hours: 72
      prior_win_prob: 0.6 # deterministic strategies have no Clef probability; this prior feeds the sizer
      conviction: 5
      regime_proxy_ema: 20 # Phase 1 regime proxy: BTC daily close above its EMA20 (until batch regime lands)
    accounts: [PAPER]
  # ADR-040: falling-market strategies. Cash account, so no shorting: bounce buys oversold reversals, the inverse
  # strategy buys 1x inverse ETFs (constitution allowlist) when the regime is bearish.
  - id: CRYPTO_OVERSOLD_BOUNCE_V1
    arena: CRYPTO
    status: SHADOW # ADR-046: 3-year backtest −0.08R/trade net of costs → LAB only
    universe:
      [
        BTC/USD,
        ETH/USD,
        SOL/USD,
        XRP/USD,
        LINK/USD,
        AVAX/USD,
        DOGE/USD,
        LTC/USD,
        BCH/USD,
        DOT/USD,
        UNI/USD,
        AAVE/USD,
        ADA/USD,
      ]
    params:
      atr_period: 14
      ema_period: 20
      rsi_period: 14
      rsi_max: 32 # oversold: yesterday's RSI14 at or below this …
      stretch_atr: 2.0 # … or the lowest of the last 3 closes ≥ 2 ATR under the EMA20
      swing_lookback_days: 5 # stop just under the 5-day swing low, clamped to [1.5, 3] ATR
      min_stop_atr: 1.5
      max_stop_atr: 3.0
      min_target_atr: 1.5 # target = EMA20, clamped to [1.5, 3] ATR above entry
      max_target_atr: 3.0
      max_hold_hours: 48
      prior_win_prob: 0.6
      conviction: 5
      crash_floor: 15 # no knife-catching while a fresh crypto composite is below this
    accounts: [PAPER]
  - id: EQUITY_INVERSE_BREAKOUT_V1
    arena: EQUITIES
    status: SHADOW # ADR-046: 3-year backtest −0.06R/trade (regime proxied) → LAB only
    universe: [SH, PSQ, RWM, BITI] # must be in constitution.allowed.inverse_etfs_1x (config:build checks)
    params:
      instrument: inverse_etf_1x
      lookback_days: 10
      atr_period: 14
      ema_period: 20
      atr_stop_multiple: 2.0
      atr_target_multiple: 3.0
      max_hold_hours: 72
      prior_win_prob: 0.6
      conviction: 5
      bear_postures: [REDUCE_ONLY, CASH_PRIORITY]
      crypto_hedges: [BITI] # gated on the crypto long gate being closed instead of the equity posture
    accounts: [PAPER]
  # ADR-041: Kronos foundation-model forecasts (research job `kronos`, GitHub CPU). The job reads these params, so the
  # probabilities it reports describe exactly the trade the brain would place. Probabilities only; the sizer sizes.
  - id: CRYPTO_KRONOS_FORECAST_V1
    arena: CRYPTO
    status: SHADOW # operator 2026-10-24: Kronos is low-confidence court context only; it never opens trades itself
    universe:
      [
        BTC/USD,
        ETH/USD,
        SOL/USD,
        XRP/USD,
        LINK/USD,
        AVAX/USD,
        DOGE/USD,
        LTC/USD,
        BCH/USD,
        DOT/USD,
        UNI/USD,
        AAVE/USD,
        ADA/USD,
      ]
    params:
      candle_hours: 4 # 4h candles: 12 steps cover 48 h; Kronos-base ~25 s per pair on a free CPU runner
      lookback_hours: 720 # 180 candles (30 days) of context
      horizon_hours: 48
      paths: 24 # independent sampled futures per pair, vol-rescaled to realized 48 h volatility
      atr_stop_multiple: 1.5 # daily ATR14
      atr_target_multiple: 2.25
      max_hold_hours: 48
      min_p_win: 0.6 # share of sampled paths that end profitable for this exact trade
      min_edge: 0.0 # p_target_first − p_stop_first must not be negative
      max_forecast_age_hours: 5 # forecasts arrive every 4 h (+ runner delay); 3 h left a dead hour each cycle
      max_price_drift: 0.0075 # skip when the bid moved this far from the forecast's last price
      conviction: 5
      crash_floor: 15
      equity_horizon_days: 2 # stocks: daily candles, the next 2 trading days (panel + court context only)
      equity_lookback_days: 250 # ~1 year of daily context (Kronos max 512)
    accounts: [PAPER]
  # ADR-045: strategies from docs/STRATEGY_RESEARCH.md. SHADOW on PAPER; they run only in the LAB brain (lab: above).
  - id: CRYPTO_TREND_V1
    arena: CRYPTO
    status: SHADOW
    universe:
      [
        BTC/USD,
        ETH/USD,
        SOL/USD,
        XRP/USD,
        LINK/USD,
        AVAX/USD,
        DOGE/USD,
        LTC/USD,
        BCH/USD,
        DOT/USD,
        UNI/USD,
        AAVE/USD,
        ADA/USD,
      ]
    params:
      lookbacks: [20, 50, 100] # all three returns positive = time-series up-trend
      ema_fast: 20
      ema_slow: 50
      breakout_days: 20
      pullback_atr: 1.0 # entry while the bid sits within 1 ATR above the EMA20 …
      atr_stop_multiple: 2.5 # … or on a new 20-day high
      atr_target_multiple: 5.0 # trends pay through the occasional long run
      max_hold_hours: 336 # 14 days
      max_new_per_run: 2 # strongest trends first
      prior_win_prob: 0.6
      conviction: 5
    accounts: [PAPER]
  - id: EQUITY_RSI2_PULLBACK_V1
    arena: EQUITIES
    status: ACTIVE # ADR-046: backtest PASS (104 trades, 78% win, +0.27R, q≈0, holds in the latest third)
    universe: [SPY, QQQ, IWM, DIA]
    params:
      sma_trend: 200
      sma_exit: 5
      rsi_max: 10
      atr_stop_multiple: 2.0
      min_target_atr: 0.6
      max_hold_hours: 168 # ~5 sessions
      prior_win_prob: 0.6
      conviction: 5
    accounts: [PAPER]
  - id: CRYPTO_TURN_OF_MONTH_V1
    arena: CRYPTO
    status: SHADOW
    universe: [BTC/USD, ETH/USD]
    params:
      last_days: 2
      exit_day: 3 # out by 00:00 UTC on the 3rd
      atr_stop_multiple: 2.0
      atr_target_multiple: 3.0
      prior_win_prob: 0.6
      conviction: 5
    accounts: [PAPER]
  - id: CRYPTO_CATALYST_COURT_V1
    arena: CRYPTO
    status: ACTIVE # Phase 3: catalyst → Tier 1 → Tier 2 → court → COURT contract (PAPER only)
    universe:
      [
        BTC/USD,
        ETH/USD,
        SOL/USD,
        XRP/USD,
        LINK/USD,
        AVAX/USD,
        DOGE/USD,
        LTC/USD,
        BCH/USD,
        DOT/USD,
        UNI/USD,
        AAVE/USD,
        ADA/USD,
      ]
    accounts: [PAPER]
  - id: EQUITY_CATALYST_COURT_V1
    arena: EQUITIES
    status: ACTIVE # regular session only; equity posture must be NEW_ENTRY_ALLOWED
    universe:
      [COIN, MSTR, IBIT, SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD, AVGO, NFLX, JPM, XOM]
    accounts: [PAPER]
  # Phase 5 options shadow lab (ADR-031): virtual ledger in D1, pessimistic fills, never sent to a broker.
  # Runs in research.yml (job=options). `structure` must be in constitution.allowed.options_structures_paper.
  - id: OPTIONS_BULL_PUT_SPREAD_V1
    arena: OPTIONS
    status: SHADOW
    universe: [SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMZN, META, GOOGL]
    params:
      structure: vertical_credit
      dte: [21, 45]
      short_delta: [0.20, 0.30] # |delta| of the short put
      width_pct: 0.01 # long put ≈ 1% of spot below the short
      min_credit_to_width: 0.18 # natural pricing (sell bid / buy ask) on a ~0.25-delta short
      take_profit_pct: 0.5 # close when cost to close ≤ 50% of the credit
      stop_multiple: 2.0 # close when cost to close ≥ 2× credit
      exit_dte: 7
    accounts: [PAPER]
  - id: OPTIONS_BULL_CALL_DEBIT_V1
    arena: OPTIONS
    status: SHADOW
    universe: [SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMZN, META, GOOGL]
    params:
      structure: vertical_debit
      dte: [30, 60]
      long_delta: [0.50, 0.62]
      width_pct: 0.04
      max_debit_to_width: 0.6
      take_profit_pct: 0.5 # of max profit
      stop_pct: 0.5 # of the debit
      exit_dte: 7
    accounts: [PAPER]
  - id: OPTIONS_PMCC_V1
    arena: OPTIONS
    status: SHADOW
    universe: [SPY, QQQ, AAPL, MSFT, NVDA, AMZN, META, GOOGL]
    params:
      structure: diagonal
      leaps_min_dte: 270
      leaps_delta: 0.80
      short_dte: [7, 21]
      short_delta: 0.20
      min_rubric_score: 7 # ported scanner-pmcc rubric (max 11 + trend/premium adjustments)
      take_profit_pct: 0.25 # of the net debit
      stop_pct: 0.4 # of the net debit
      exit_short_dte: 2 # close the whole diagonal before the short expires (rolls not modeled)
    accounts: [PAPER]
  - id: EQUITY_MOMENTUM_BURST_V1
    arena: EQUITIES
    status: SHADOW
    accounts: [PAPER]
  - id: CRYPTO_VCP_BREAKOUT_V1
    arena: CRYPTO
    status: SHADOW
    accounts: [PAPER]
  - id: EQUITY_EARNINGS_DRIFT_V1
    arena: EQUITIES
    status: PROPOSAL
    accounts: []

watchlists:
  # Liquid Alpaca USD pairs (no stablecoins, no thin meme tokens). News intake and the court use all of these.
  crypto:
    [
      BTC/USD,
      ETH/USD,
      SOL/USD,
      XRP/USD,
      LINK/USD,
      AVAX/USD,
      DOGE/USD,
      LTC/USD,
      BCH/USD,
      DOT/USD,
      UNI/USD,
      AAVE/USD,
      ADA/USD,
    ]
  crypto_proxies: [COIN, MSTR, IBIT]
  equities_core: [SPY, QQQ, IWM]
  # Mega-caps: frequent news and SEC filings, fractionable, tight spreads.
  equities_catalyst: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD, AVGO, NFLX, JPM, XOM]

# ADR-058: dynamic universe. The doctrine watchlists above stay the permanent core (rule strategies, Kronos, regime
# proxies). The whole Alpaca news stream is intake behind a zero-neuron prefilter; a catalyst about any other symbol
# that reaches Tier 2 is screened in code and hot-ported for ttl_days. Thresholds were set from live data on
# 2026-10-26: Alpaca's own crypto venue trades ~$5k/day in DOT and ~$200k/day in BTC; the free IEX stock feed is ~2%
# of consolidated volume (NVDA ≈ $670M/day on IEX), and IEX quotes are wider than the real market.
universe:
  enabled: true
  news_scope: all
  max_dynamic: 40 # hot-ported TRADE symbols at once (oldest unheld evicted)
  ttl_days: 7 # a new catalyst renews it; a held symbol never expires
  min_price_usd: 3 # equities only
  min_dollar_volume_usd: { CRYPTO: 1000, EQUITIES: 5000000 } # 20-day average on Alpaca's venue / IEX
  max_spread_bps: { CRYPTO: 40, EQUITIES: 60 } # screen only; the validator still applies execution.max_spread_bps
  max_ports_per_day: 12 # screens per UTC day (3 data calls each)
  max_watch: 60 # research-named related symbols
  prefilter_min_score: 2
  max_open_intake_per_day: 150 # non-watchlist headlines into Tier 1 (≈180 clef-flash neurons)

# ADR-059: exit intelligence. Stops only ever move up; models choose HOLD/TIGHTEN/EXIT, code computes every price.
exits:
  enabled: true
  breakeven_at_r: 1.0 # best price ≥ entry + 1R → stop to entry + round-trip fees
  trail_after_r: 1.5 # then a chandelier: best price − k × ATR
  trail_atr: { calm: 1.2, stressed: 0.8 } # stressed = regime no longer allows longs
  harvest:
    enabled: true # at the target, keep running on a trail while trend, regime and forecast agree
    max_extra_hours: 48 # past the contract horizon, only while trailing
    max_rsi: 78 # daily RSI14 at or above this = exhausted → sell at the target
  review:
    enabled: true # re-underwriting hearings (one Clef 27B call each, Tier 2 neuron pool)
    max_per_day: 20
    cooldown_minutes: 120 # per position, unless a new tripwire appears
    held_material_min: 0.5 # Tier 1 materiality that makes a headline about a held symbol a tripwire
    exit_prob: 0.6
    kill_prob: 0.7
  watch_research:
    enabled: true # daily surveillance dossier per held position (bear kill criteria)
    every_hours: 24
  earnings_derisk: true # equities are sold before earnings inside the blackout window
  rotation:
    enabled: true # release a stagnant position for a better waiting candidate when slots are full
    min_horizon_fraction: 0.5
    max_abs_r: 0.25
    min_candidate_win: 0.6

# ADR-060: entry timing.
entry_timing:
  lateness:
    enabled: true # Tier 0 refuses a catalyst whose move is mostly done (graded, so the Governor can price the rule)
    late_atr: 0.8 # price already moved ≥ 0.8 daily ATR since the headline → LATE
    mid_atr: 0.4
  resting:
    enabled: true # a court contract whose price ran past its zone (or found no free slot) waits for it instead
    max_hours: 48 # and never longer than half the contract's horizon
