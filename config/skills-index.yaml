# Canonical skill registry. Rules in docs/SKILLS_PORTING.md.
# runtime: ts-hot | py-batch | llm-prompt | deferred | cut
# status:  PROPOSAL | SHADOW | ACTIVE | DEMOTED   (only ACTIVE skills influence sizing)
version: 1
sources:
