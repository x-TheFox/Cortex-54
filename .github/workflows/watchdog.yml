name: watchdog

# Independent backup for the sentinel's own per-minute cron (ADR-021): if Cloudflare cron stalls, this still runs
# the checks. GitHub schedules are UTC and can be delayed or skipped under load.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tick sentinel
        env:
          SENTINEL_URL: ${{ vars.SENTINEL_URL }}
          SENTINEL_TICK_SECRET: ${{ secrets.SENTINEL_TICK_SECRET }}
        run: |
          if [ -z "$SENTINEL_URL" ] || [ -z "$SENTINEL_TICK_SECRET" ]; then echo "sentinel not configured"; exit 0; fi
          curl -fsS --max-time 30 -X POST -H "authorization: Bearer $SENTINEL_TICK_SECRET" "$SENTINEL_URL/tick"
