name: research
# "research <job>" for dispatched runs (the brain dispatches on schedule, ADR-032); scheduled runs show the cron.
run-name: research ${{ inputs.job || github.event.schedule }}

# Phase 2 batch jobs (docs/ARCHITECTURE.md §9). Runs pinned upstream skills (never copied — ADR-026),
# summarizes, signs with INGEST_HMAC_SECRET and POSTs to cortex /ingest/batch.
# Schedules are UTC and may be delayed or skipped; the brain alarms when regime data goes stale.
on:
  schedule:
    - cron: "7 */4 * * *" # crypto regime every 4 h
    - cron: "40 12 * * 1-5" # equity posture before the US open (08:40 EDT / 07:40 EST)
    - cron: "20 21 * * 1-5" # equity posture after the close
    - cron: "17 * * * *" # world intel (GDELT + EDGAR) hourly
    - cron: "50 14 * * 1-5" # options shadow lab after the open (10:50 EDT / 09:50 EST)
    - cron: "40 19 * * 1-5" # options shadow lab before the close
    - cron: "45 14 * * *" # setup screeners during the session (crypto only on weekends)
  workflow_dispatch:
    inputs:
      job:
        description: "Which job"
        required: true
        type: choice
        options: [crypto, equity, world, options, screeners]

permissions:
  contents: read
  actions: read # dedupe step lists recent runs

concurrency:
  group: research-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: tradermonty/claude-trading-skills
  UPSTREAM_SHA: cb0f3aadffed6d1089db4b224162c964368baa46

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "7 */4 * * *" ]; then echo "job=crypto" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "17 * * * *" ]; then echo "job=world" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "50 14 * * 1-5" ] || [ "${{ github.event.schedule }}" = "40 19 * * 1-5" ]; then echo "job=options" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "45 14 * * *" ]; then echo "job=screeners" >> "$GITHUB_OUTPUT";
          else echo "job=equity" >> "$GITHUB_OUTPUT"; fi
      - name: Skip if the brain already dispatched this job
        id: dedupe
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          since=$(date -u -d '-90 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow research.yml --event workflow_dispatch --created ">=$since" \
                --json displayTitle --jq "[.[] | select(.displayTitle == \"research $JOB\")] | length")
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "brain dispatched $JOB already ($n run(s) since $since)"; fi
      - name: Checkout pinned upstream skills
        if: steps.dedupe.outputs.skip != 'true' && (steps.pick.outputs.job == 'crypto' || steps.pick.outputs.job == 'equity' || steps.pick.outputs.job == 'screeners')
        run: |
          git clone --filter=blob:none "https://github.com/${UPSTREAM_REPO}" research/.vendor/upstream
          git -C research/.vendor/upstream checkout --quiet "${UPSTREAM_SHA}"
      - name: Run and ingest
        if: steps.dedupe.outputs.skip != 'true' && steps.pick.outputs.job != 'options'
        working-directory: research
        env:
          UPSTREAM_DIR: ${{ github.workspace }}/research/.vendor/upstream
          CORTEX_URL: ${{ vars.CORTEX_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python -m cortex_research.run "${{ steps.pick.outputs.job }}"
      - name: Options shadow lab (virtual ledger, never sent to a broker)
        if: steps.dedupe.outputs.skip != 'true' && steps.pick.outputs.job == 'options'
        working-directory: research
        env:
          CORTEX_URL: ${{ vars.CORTEX_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python -m cortex_research.options.lab
