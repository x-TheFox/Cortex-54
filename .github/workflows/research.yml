name: research
# "research <job>" for dispatched runs (the brain dispatches on schedule, ADR-032); scheduled runs show the cron.
run-name: research ${{ inputs.job || github.event.schedule }}${{ inputs.symbol && format(' {0}', inputs.symbol) || '' }}

# Phase 2 batch jobs (docs/ARCHITECTURE.md §9). Runs pinned upstream skills (never copied — ADR-026),
# summarizes, signs with INGEST_HMAC_SECRET and POSTs to cortex /ingest/batch.
# Schedules are UTC and may be delayed or skipped; the brain alarms when regime data goes stale.
on:
  schedule:
    - cron: "7 */4 * * *" # crypto regime every 4 h
    - cron: "40 12 * * 1-5" # equity posture before the US open (08:40 EDT / 07:40 EST)
    - cron: "20 21 * * 1-5" # equity posture after the close
    - cron: "17 * * * *" # world intel (GDELT + EDGAR) hourly
    - cron: "50 14 * * 1-5" # options shadow lab after the open (10:50 EDT / 09:50 EST)
    - cron: "40 19 * * 1-5" # options shadow lab before the close
    - cron: "45 14 * * *" # setup screeners during the session (crypto only on weekends)
    - cron: "37 */4 * * *" # Kronos forecasts (ADR-041), ~5 min of CPU
    - cron: "13 7 * * 0" # backtest lab (ADR-046), Sundays
  workflow_dispatch:
    inputs:
      job:
        description: "Which job"
        required: true
        type: choice
        options: [crypto, equity, world, options, screeners, kronos, backtest, dossier]
      symbol:
        description: "dossier only: symbol to research (BTC/USD, COIN)"
        required: false
        type: string
      context:
        description: "dossier only: why the court is convening"
        required: false
        type: string
      arena:
        description: "dossier only: CRYPTO or EQUITIES (the brain sends it; needed for symbols outside the watchlists)"
        required: false
        type: string
      mode:
        description: "dossier only: case (before a court) or watch (an open position)"
        required: false
        type: string
      depth:
        description: "dossier only: quick | standard | deep"
        required: false
        type: string
      catalyst:
        description: "dossier only: the headline that triggered the case"
        required: false
        type: string
      kill:
        description: "dossier only (watch): the bear's kill criteria, separated by |"
        required: false
        type: string

permissions:
  contents: read
  actions: read # dedupe step lists recent runs

concurrency:
  group: research-${{ github.event.schedule || inputs.job }}${{ inputs.symbol && format('-{0}', inputs.symbol) || '' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: tradermonty/claude-trading-skills
  UPSTREAM_SHA: cb0f3aadffed6d1089db4b224162c964368baa46
  KRONOS_REPO: shiyu-coder/Kronos # MIT; run from a pinned checkout, never copied (NOTICE.md)
  KRONOS_SHA: 67b630e67f6a18c9e9be918d9b4337c960db1e9a

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 160 # Kronos-base ~25 s per pair on CPU; the deep research ring up to ~2 h (ADR-057)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "7 */4 * * *" ]; then echo "job=crypto" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "17 * * * *" ]; then echo "job=world" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "50 14 * * 1-5" ] || [ "${{ github.event.schedule }}" = "40 19 * * 1-5" ]; then echo "job=options" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "45 14 * * *" ]; then echo "job=screeners" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "37 */4 * * *" ]; then echo "job=kronos" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "13 7 * * 0" ]; then echo "job=backtest" >> "$GITHUB_OUTPUT";
          else echo "job=equity" >> "$GITHUB_OUTPUT"; fi
      - name: Skip if the brain already dispatched this job
        id: dedupe
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          since=$(date -u -d '-90 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow research.yml --event workflow_dispatch --created ">=$since" \
                --json displayTitle --jq "[.[] | select(.displayTitle == \"research $JOB\")] | length")
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "brain dispatched $JOB already ($n run(s) since $since)"; fi
      - name: Checkout pinned upstream skills
        if: steps.dedupe.outputs.skip != 'true' && (steps.pick.outputs.job == 'crypto' || steps.pick.outputs.job == 'equity' || steps.pick.outputs.job == 'screeners')
        run: |
          git clone --filter=blob:none "https://github.com/${UPSTREAM_REPO}" research/.vendor/upstream
          git -C research/.vendor/upstream checkout --quiet "${UPSTREAM_SHA}"
      - name: Checkout pinned Kronos
        if: steps.dedupe.outputs.skip != 'true' && steps.pick.outputs.job == 'kronos'
        run: |
          git clone --filter=blob:none "https://github.com/${KRONOS_REPO}" research/.vendor/kronos
          git -C research/.vendor/kronos checkout --quiet "${KRONOS_SHA}"
      - name: Cache Kronos weights
        if: steps.dedupe.outputs.skip != 'true' && steps.pick.outputs.job == 'kronos'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-weights-base-v1
      - name: Kronos forecasts and ingest
        if: steps.dedupe.outputs.skip != 'true' && steps.pick.outputs.job == 'kronos'
        working-directory: research
        env:
          KRONOS_DIR: ${{ github.workspace }}/research/.vendor/kronos
          CORTEX_URL: ${{ vars.CORTEX_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run --group kronos python -m cortex_research.run kronos
      - name: Deep research dossier (ADR-051; read-only web tools, free LLM chain)
        if: steps.pick.outputs.job == 'dossier'
        working-directory: research
        timeout-minutes: 150 # ADR-057: fast dossier posts within ~15 min; the deep ring may run up to ~2 h
        env:
          CORTEX_URL: ${{ vars.CORTEX_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_LAB_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_LAB_SECRET }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOSSIER_SYMBOL: ${{ inputs.symbol }}
          DOSSIER_CONTEXT: ${{ inputs.context }}
          DOSSIER_ARENA: ${{ inputs.arena }}
          DOSSIER_MODE: ${{ inputs.mode }}
          DOSSIER_DEPTH: ${{ inputs.depth }}
          DOSSIER_CATALYST: ${{ inputs.catalyst }}
          DOSSIER_KILL: ${{ inputs.kill }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python -m cortex_research.run dossier
      - name: Run and ingest
        if: steps.dedupe.outputs.skip != 'true' && steps.pick.outputs.job != 'options' && steps.pick.outputs.job != 'kronos' && steps.pick.outputs.job != 'dossier'
        working-directory: research
        env:
          UPSTREAM_DIR: ${{ github.workspace }}/research/.vendor/upstream
          CORTEX_URL: ${{ vars.CORTEX_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # the backtest pages ~3 years × 25 symbols: use the LAB key's own 200/min data budget
          ALPACA_KEY_ID: ${{ steps.pick.outputs.job == 'backtest' && secrets.ALPACA_LAB_KEY_ID || secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_SECRET: ${{ steps.pick.outputs.job == 'backtest' && secrets.ALPACA_LAB_SECRET || secrets.ALPACA_PAPER_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python -m cortex_research.run "${{ steps.pick.outputs.job }}"
      - name: Options shadow lab (virtual ledger, never sent to a broker)
        if: steps.dedupe.outputs.skip != 'true' && steps.pick.outputs.job == 'options'
        working-directory: research
        env:
          CORTEX_URL: ${{ vars.CORTEX_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python -m cortex_research.options.lab
