name: release

# ADR-077: every merge to main that touches the app builds the desktop app for every supported platform and publishes
# a GitHub release with an autogenerated changelog. Installed apps update themselves from the latest release's
# latest.json (signed with the updater key; without TAURI_SIGNING_PRIVATE_KEY the installers still ship, unsigned for
# auto-update). Run it by hand to pick a minor or major bump.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "local/**"
      - "web/**"
      - "desktop/**"
      - "research/**"
      - "config/**"
      - "migrations/**"
      - "scripts/build-cortexd.ts"
      - "scripts/fetch-node-runtime.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# ADR-092: with the source repository private, installers are published to a public, binary-only repository
# (repository variable RELEASES_REPO, e.g. x-TheFox/savant-releases, and a fine-grained token RELEASES_TOKEN with
# Contents: read and write on it). Unset = releases stay in this repository. `gh` reads GH_REPO.
env:
  GH_REPO: ${{ vars.RELEASES_REPO || github.repository }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: v
        env:
          # ADR-079: the notes say "notarized" only when the Apple signing secrets exist
          APPLE_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
        run: |
          out=$(node scripts/changelog.ts --bump "${{ inputs.bump || 'patch' }}" --out release-notes.md $([ "$APPLE_SIGNED" = "true" ] && echo --notarized))
          echo "version=$(echo "$out" | jq -r .version)" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo "$out" | jq -r .tag)" >> "$GITHUB_OUTPUT"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          # a failed earlier run leaves a draft under the same tag: replace it (published releases are never touched)
          if [ "$(gh release view "${{ steps.v.outputs.tag }}" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "${{ steps.v.outputs.tag }}" --yes
          fi
          if [ "$GH_REPO" = "$GITHUB_REPOSITORY" ]; then
            gh release create "${{ steps.v.outputs.tag }}" --draft --target "$GITHUB_SHA" \
              --title "Savant ${{ steps.v.outputs.version }}" --notes-file release-notes.md
          else
            # the version comes from this repository's tags (scripts/changelog.ts), so tag the source here too
            git tag -f "${{ steps.v.outputs.tag }}" "$GITHUB_SHA"
            git push -f "https://x-access-token:${SOURCE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${{ steps.v.outputs.tag }}"
            gh release create "${{ steps.v.outputs.tag }}" --draft \
              --title "Savant ${{ steps.v.outputs.version }}" --notes-file release-notes.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: release-notes.md

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x86_64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CORTEX_LICENSE_PUBKEY: ${{ vars.CORTEX_LICENSE_PUBKEY }}
      CORTEX_VERSION: ${{ needs.plan.outputs.version }}
      # ADR-086: where the app activates Whop licence keys and where "Buy / manage" points (repository variables)
      SAVANT_LICENSE_URL: ${{ vars.SAVANT_LICENSE_URL }}
      SAVANT_STORE_URL: ${{ vars.SAVANT_STORE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev file
      - name: Apple signing and notarization (ADR-079; only when the secrets exist)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # tauri signs when APPLE_CERTIFICATE + APPLE_SIGNING_IDENTITY are set and notarizes with APPLE_ID; empty
          # values must stay unset, or it would try to sign with nothing
          n=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then { echo "$v<<__C54__"; echo "${!v}"; echo "__C54__"; } >> "$GITHUB_ENV"; n=$((n+1)); fi
          done
          echo "$n of 6 Apple values set (6 = signed and notarized; 0 = unsigned)"
      # ADR-089: uv compiles the research package to bytecode for the shipped build
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm cortexd:build
      - name: Bundled Node runtime
        run: pnpm exec tsx scripts/fetch-node-runtime.ts ${{ matrix.target }}
      - name: Release config (version, updater artifacts only when the signing key exists)
        shell: bash
        run: |
          node -e '
            const signed = Boolean(process.env.TAURI_SIGNING_PRIVATE_KEY);
            require("fs").writeFileSync("desktop/src-tauri/tauri.release.conf.json", JSON.stringify({
              version: process.env.CORTEX_VERSION,
              bundle: { createUpdaterArtifacts: signed },
            }));
            console.log(signed ? "signed updater bundles" : "no TAURI_SIGNING_PRIVATE_KEY: installers only");
          '
      - name: Build the app
        shell: bash
        run: |
          pnpm exec tauri build --target ${{ matrix.target }} \
            --config desktop/src-tauri/tauri.conf.json --config desktop/src-tauri/tauri.release.conf.json
      - name: Collect installers
        shell: bash
        run: node scripts/release-assets.ts ${{ matrix.target }} ${{ matrix.platform }} ${{ needs.plan.outputs.version }} out
      - name: MSIX package (ADR-079)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          v=${{ needs.plan.outputs.version }}
          node scripts/msix.ts "out/Savant_${v}_${{ matrix.platform }}.msi" "$v" "out/Savant_${v}_${{ matrix.platform }}.msix"
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          shopt -s nullglob
          files=()
          for f in out/*; do [[ "$f" == out/updater-*.json ]] || files+=("$f"); done
          gh release upload "${{ needs.plan.outputs.tag }}" "${files[@]}" --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-${{ matrix.platform }}
          path: out/updater-*.json
          if-no-files-found: ignore

  demo:
    # ADR-077: the public demo cockpit (the real panel on synthetic data) as a static zip on every release
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:build && pnpm web:demo
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          (cd demo-dist && zip -qr ../cortex54-demo-cockpit.zip .)
          gh release upload "${{ needs.plan.outputs.tag }}" cortex54-demo-cockpit.zip --clobber

  publish:
    needs: [plan, build, demo]
    # audit F-A5-12: paying customers update from this release, so it goes live only when every platform built and
    # the demo built; otherwise the draft stays a draft for a look
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' && needs.demo.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: art
          merge-multiple: true
      - name: Updater manifest
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          if ls art/updater-*.json >/dev/null 2>&1; then
            node scripts/updater-manifest.ts art "${{ needs.plan.outputs.version }}" art/release-notes.md > latest.json
            gh release upload "${{ needs.plan.outputs.tag }}" latest.json --clobber
          else
            echo "No signed updater bundles: installed apps won't see this release until TAURI_SIGNING_PRIVATE_KEY is set."
          fi
      - name: Publish (only when at least one platform built)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          n=$(gh release view "${{ needs.plan.outputs.tag }}" --json assets --jq '[.assets[].name | select(test("\\.(dmg|msi|msix|exe|AppImage|deb|rpm)$"))] | length')
          if [ "$n" -gt 0 ]; then
            gh release edit "${{ needs.plan.outputs.tag }}" --draft=false --latest
          else
            echo "No installers built; the draft stays a draft." && exit 1
          fi
