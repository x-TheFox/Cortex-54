name: release

# ADR-077: every merge to main that touches the app builds the desktop app for every supported platform and publishes
# a GitHub release with an autogenerated changelog. Installed apps update themselves from the latest release's
# latest.json (signed with the updater key; without TAURI_SIGNING_PRIVATE_KEY the installers still ship, unsigned for
# auto-update). Run it by hand to pick a minor or major bump.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "local/**"
      - "web/**"
      - "desktop/**"
      - "research/**"
      - "config/**"
      - "migrations/**"
      - "scripts/build-cortexd.ts"
      - "scripts/fetch-node-runtime.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: v
        run: |
          out=$(node scripts/changelog.ts --bump "${{ inputs.bump || 'patch' }}" --out release-notes.md)
          echo "version=$(echo "$out" | jq -r .version)" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo "$out" | jq -r .tag)" >> "$GITHUB_OUTPUT"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a failed earlier run leaves a draft under the same tag: replace it (published releases are never touched)
          if [ "$(gh release view "${{ steps.v.outputs.tag }}" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "${{ steps.v.outputs.tag }}" --yes
          fi
          gh release create "${{ steps.v.outputs.tag }}" --draft --target "$GITHUB_SHA" \
            --title "CORTEX-54 ${{ steps.v.outputs.version }}" --notes-file release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: release-notes.md

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x86_64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CORTEX_LICENSE_PUBKEY: ${{ vars.CORTEX_LICENSE_PUBKEY }}
      CORTEX_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev file
      - run: pnpm install --frozen-lockfile
      - run: pnpm cortexd:build
      - name: Bundled Node runtime
        run: pnpm exec tsx scripts/fetch-node-runtime.ts ${{ matrix.target }}
      - name: Release config (version, updater artifacts only when the signing key exists)
        shell: bash
        run: |
          node -e '
            const signed = Boolean(process.env.TAURI_SIGNING_PRIVATE_KEY);
            require("fs").writeFileSync("desktop/src-tauri/tauri.release.conf.json", JSON.stringify({
              version: process.env.CORTEX_VERSION,
              bundle: { createUpdaterArtifacts: signed },
            }));
            console.log(signed ? "signed updater bundles" : "no TAURI_SIGNING_PRIVATE_KEY: installers only");
          '
      - name: Build the app
        shell: bash
        run: |
          pnpm exec tauri build --target ${{ matrix.target }} \
            --config desktop/src-tauri/tauri.conf.json --config desktop/src-tauri/tauri.release.conf.json
      - name: Collect installers
        shell: bash
        run: node scripts/release-assets.ts ${{ matrix.target }} ${{ matrix.platform }} ${{ needs.plan.outputs.version }} out
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=()
          for f in out/*; do [[ "$f" == out/updater-*.json ]] || files+=("$f"); done
          gh release upload "${{ needs.plan.outputs.tag }}" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}
          path: out/updater-*.json
          if-no-files-found: ignore

  demo:
    # ADR-077: the public demo cockpit (the real panel on synthetic data) as a static zip on every release
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:build && pnpm web:demo
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd demo-dist && zip -qr ../cortex54-demo-cockpit.zip .)
          gh release upload "${{ needs.plan.outputs.tag }}" cortex54-demo-cockpit.zip --clobber

  publish:
    needs: [plan, build, demo]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Updater manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls art/updater-*.json >/dev/null 2>&1; then
            node scripts/updater-manifest.ts art "${{ needs.plan.outputs.version }}" art/release-notes.md > latest.json
            gh release upload "${{ needs.plan.outputs.tag }}" latest.json --clobber
          else
            echo "No signed updater bundles: installed apps won't see this release until TAURI_SIGNING_PRIVATE_KEY is set."
          fi
      - name: Publish (only when at least one platform built)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh release view "${{ needs.plan.outputs.tag }}" --json assets --jq '[.assets[].name | select(test("\\.(dmg|msi|exe|AppImage|deb|rpm)$"))] | length')
          if [ "$n" -gt 0 ]; then
            gh release edit "${{ needs.plan.outputs.tag }}" --draft=false --latest
          else
            echo "No installers built; the draft stays a draft." && exit 1
          fi
