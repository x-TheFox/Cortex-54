name: governor
run-name: governor ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.event.schedule }}

# Phase 4 learning loop (docs/ARCHITECTURE.md §9). Daily: grade the rejection shadow ledger, postmortem closed
# trades, score fitness and the LIVE gate, send results to the brain. Sunday: also post the report card and, once
# ≥50 outcomes exist, propose a new config/calibration.json on a branch. Constitution U8: the Governor only
# proposes; the operator merges.
on:
  schedule:
    - cron: "23 6 * * 1-6" # daily
    - cron: "23 6 * * 0" # weekly report + calibration proposal
  workflow_dispatch:
    inputs:
      weekly:
        description: "Post the report card and refresh calibration"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read # dedupe step lists recent runs

concurrency:
  group: governor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip if the brain already dispatched today's run
        id: dedupe
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow governor.yml --event workflow_dispatch --created ">=$since" --json databaseId --jq length)
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "already dispatched"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.dedupe.outputs.skip != 'true'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.dedupe.outputs.skip != 'true'
      - name: Mode
        id: mode
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          if [ "${{ github.event.schedule }}" = "23 6 * * 0" ] || [ "${{ inputs.weekly }}" = "true" ]; then echo "flag=--weekly" >> "$GITHUB_OUTPUT"; else echo "flag=" >> "$GITHUB_OUTPUT"; fi
      - name: Run governor
        if: steps.dedupe.outputs.skip != 'true'
        working-directory: research
        env:
          CORTEX_URL: ${{ vars.CORTEX_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python -m cortex_research.governor.run ${{ steps.mode.outputs.flag }}
      # PRs opened with GITHUB_TOKEN never trigger ci.yml, so the proposal is validated here before it can become a
      # PR at all (audit W2-16): schema + constitution checks (config:build) and the config and calibration tests.
      - name: Check for proposals
        id: changed
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          if git diff --quiet -- config/calibration.json config/scar-tissue.yaml; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.changed.outputs.any == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.any == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Validate proposals against the constitution
        if: steps.changed.outputs.any == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm config:build
          pnpm vitest run test/config.test.ts test/court.test.ts test/scar.test.ts
      - name: Propose calibration / scar tissue (branch + PR)
        if: steps.changed.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          branch="governor/proposals-$(date -u +%Y%m%d)-${{ github.run_id }}"
          git config user.name "x-TheFox"
          git config user.email "${AUTHOR_EMAIL}"
          git checkout -b "$branch"
          git add config/calibration.json config/scar-tissue.yaml
          git commit -m "Governor: weekly proposals (calibration / scar tissue)"
          git push origin "$branch"
          body="Weekly Governor proposals (calibration map and/or scar-tissue rules, each rule citing ≥3 contracts) from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Review each rule's evidence and the Brier numbers before merging (constitution U8)."
          if ! gh pr create --base main --head "$branch" --title "Governor: proposals $(date -u +%F)" --body "$body"; then
            url="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
            echo "Actions may not open PRs in this repo; open it here: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
