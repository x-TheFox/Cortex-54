name: governor

# Phase 4 learning loop (docs/ARCHITECTURE.md §9). Daily: grade the rejection shadow ledger, postmortem closed
# trades, score fitness and the LIVE gate, send results to the brain. Sunday: also post the report card and, once
# ≥50 outcomes exist, propose a new config/calibration.json on a branch. Constitution U8: the Governor only
# proposes; the operator merges.
on:
  schedule:
    - cron: "23 6 * * 1-6" # daily
    - cron: "23 6 * * 0" # weekly report + calibration proposal
  workflow_dispatch:
    inputs:
      weekly:
        description: "Post the report card and refresh calibration"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: governor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "23 6 * * 0" ] || [ "${{ inputs.weekly }}" = "true" ]; then echo "flag=--weekly" >> "$GITHUB_OUTPUT"; else echo "flag=" >> "$GITHUB_OUTPUT"; fi
      - name: Run governor
        working-directory: research
        env:
          CORTEX_URL: ${{ vars.CORTEX_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python -m cortex_research.governor.run ${{ steps.mode.outputs.flag }}
      - name: Propose calibration (branch + PR)
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          if git diff --quiet -- config/calibration.json; then echo "no calibration change"; exit 0; fi
          branch="governor/calibration-$(date -u +%Y%m%d)"
          git config user.name "x-TheFox"
          git config user.email "${AUTHOR_EMAIL}"
          git checkout -b "$branch"
          git add config/calibration.json
          git commit -m "Governor: refresh court win-probability calibration map"
          git push -f origin "$branch"
          body="Isotonic calibration map refreshed from logged outcomes by the weekly Governor run (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Review the Brier numbers in the file before merging (constitution U8)."
          if ! gh pr create --base main --head "$branch" --title "Governor: calibration map $(date -u +%F)" --body "$body"; then
            url="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
            echo "Actions may not open PRs in this repo; open it here: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
